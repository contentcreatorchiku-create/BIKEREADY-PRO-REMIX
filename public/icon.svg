<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect x="24" y="24" width="464" height="464" rx="96" fill="none" stroke="#f59e0b" stroke-width="8" stroke-opacity="0.3" />
  
  <!-- Motorcycle Icon -->
  <g transform="translate(64, 80) scale(0.75)" fill="none" stroke="url(#amberGrad)" stroke-width="24" stroke-linecap="round" stroke-linejoin="round">
    <!-- Wheels -->
    <circle cx="96" cy="336" r="64" stroke="#f59e0b" fill="#0f172a" stroke-width="20" />
    <circle cx="416" cy="336" r="64" stroke="#f59e0b" fill="#0f172a" stroke-width="20" />
    <circle cx="96" cy="336" r="20" fill="#f59e0b" />
    <circle cx="416" cy="336" r="20" fill="#f59e0b" />
    
    <!-- Frame & Engine -->
    <path d="M96 336 L192 336 L272 240 L160 240 Z" fill="#1e293b" stroke="#f59e0b" stroke-width="16" />
    <path d="M272 240 L352 144 L416 336" stroke="#fbbf24" stroke-width="22" />
    <path d="M192 336 L240 176 L352 144" stroke="#fbbf24" stroke-width="20" />
    <path d="M160 240 L220 144 L272 144" stroke="#fbbf24" stroke-width="20" />
    <path d="M320 112 L384 112" stroke="#f59e0b" stroke-width="24" />
    <!-- Exhaust -->
    <path d="M220 288 L336 288 L384 310" stroke="#94a3b8" stroke-width="16" />
  </g>
  
  <!-- BikeReady Badge Text -->
  <text x="256" y="440" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="44" fill="#ffffff" letter-spacing="4">BIKEREADY</text>
  <text x="256" y="475" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="20" fill="#f59e0b" letter-spacing="3">WORKSHOP OS</text>
</svg>
